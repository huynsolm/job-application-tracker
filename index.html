<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="브라우저에만 저장되는 개인 지원 현황 및 마감일 관리 도구입니다.">
  <title>지원 기록 | Job Application Tracker</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header"><div class="shell"><p class="eyebrow">PRIVATE CAREER TOOL</p><h1>지원 기록</h1><p>지원 현황과 마감일을 이 브라우저에만 저장합니다.</p></div></header>
  <main id="main" class="shell">
    <section class="summary" aria-label="지원 현황 요약"><article><span>진행 중 지원</span><strong data-active-count>0</strong></article><article><span>면접 진행</span><strong data-interview-count>0</strong></article><article><span>저장 위치</span><strong>내 브라우저</strong></article></section>
    <section class="panel" aria-labelledby="form-title"><div class="section-heading"><div><p class="eyebrow">NEW APPLICATION</p><h2 id="form-title">지원 기록 추가</h2></div><p>필수 항목만 입력해도 저장할 수 있습니다.</p></div>
      <form data-application-form novalidate>
        <div class="field-grid"><label>회사명 <b aria-hidden="true">*</b><input name="company" required autocomplete="organization"></label><label>지원 직무 <b aria-hidden="true">*</b><input name="role" required></label><label>공고 URL <input name="url" type="url" inputmode="url" placeholder="https://"></label><label>마감일 <input name="deadline" type="date"></label><label>상태 <select name="status"><option>Saved</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Closed</option></select></label><label>메모 <textarea name="notes" rows="3" placeholder="제출 파일, 다음 할 일 등"></textarea></label></div>
        <div class="form-actions"><button type="submit">지원 기록 저장</button><p data-form-message role="status" aria-live="polite"></p></div>
      </form>
    </section>
    <section class="panel backup" aria-labelledby="backup-title"><div class="section-heading"><div><p class="eyebrow">BACKUP</p><h2 id="backup-title">백업과 복원</h2></div><p>JSON 파일로 전체 지원 기록을 내려받거나 다른 브라우저에서 가져올 수 있습니다.</p></div><div class="backup-actions"><button type="button" data-export>백업 다운로드</button><label class="button-file" for="import-file">백업 파일 가져오기<input id="import-file" data-import type="file" accept="application/json,.json"></label></div><p data-backup-message role="status" aria-live="polite"></p></section>
    <section class="applications" aria-labelledby="applications-title"><div class="section-heading"><div><p class="eyebrow">APPLICATIONS</p><h2 id="applications-title">지원 목록</h2></div><div class="filters"><label class="sr-only" for="search">회사 또는 직무 검색</label><input id="search" data-search placeholder="회사 또는 직무 검색"><label class="sr-only" for="status-filter">상태 필터</label><select id="status-filter" data-status-filter><option value="All">전체 상태</option><option>Saved</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Closed</option></select></div></div><div data-application-list class="application-list"></div></section>
  </main>
</body>
</html>
